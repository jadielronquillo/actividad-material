<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>Agenda de estudio</title>

  <style>
    :root {
      --primario: #00696b;
      --sobre-primario: #ffffff;
      --primario-tenue: #00696b1f;
      --fondo: #f7fbfb;
      --superficie: #e6f2f1;
      --texto: #1a1c1c;
      --borde: #6f7979;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fondo);
      color: var(--texto);
      font-family: Arial, sans-serif;
      line-height: 1.5;
    }

    header {
      padding: 28px 20px;
      background: var(--primario);
      color: var(--sobre-primario);
    }

    header div,
    main {
      width: min(100%, 760px);
      margin: auto;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
    }

    header p {
      margin-bottom: 0;
    }

    main {
      padding: 24px 16px;
    }

    .tarjeta {
      margin-bottom: 24px;
      padding: 24px;
      border-radius: 24px;
      background: var(--superficie);
      box-shadow: 0 2px 6px #00000018;
    }

    h2 {
      margin-top: 0;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }

    .controles {
      display: flex;
      gap: 12px;
    }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 14px;
      border: 1px solid var(--borde);
      border-radius: 8px;
      background: var(--fondo);
      color: var(--texto);
      font: inherit;
    }

    button {
      min-height: 48px;
      padding: 12px 24px;
      border: 0;
      border-radius: 28px;
      background: var(--primario);
      color: var(--sobre-primario);
      font: inherit;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(0.9);
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid var(--primario);
      outline-offset: 3px;
    }

    ul {
      padding: 0;
      list-style: none;
    }

    .tarea {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      padding: 16px;
      border: 1px solid var(--borde);
      border-radius: 16px;
    }

    .tarea label {
      flex: 1;
      margin: 0;
      overflow-wrap: anywhere;
      font-weight: normal;
      cursor: pointer;
    }

    .tarea input {
      width: 22px;
      height: 22px;
      accent-color: var(--primario);
    }

    .completada label {
      text-decoration: line-through;
    }

    #mensaje {
      min-height: 24px;
      margin-bottom: 0;
    }

    /* Botón de eliminar de cada tarea */
    .boton-eliminar {
      min-height: 44px;
      padding: 8px 16px;
      background: transparent;
      color: var(--primario);
    }

    .boton-eliminar:hover {
      background: var(--primario-tenue);
      filter: none;
    }

    /* Botón para eliminar todas las tareas completadas */
    #eliminar-completadas {
      margin-top: 16px;
    }

    @media (max-width: 500px) {
      .controles {
        flex-direction: column;
      }

      .tarea {
        gap: 8px;
        padding: 12px;
      }

      .boton-eliminar {
        padding: 8px 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <h1>Agenda de estudio</h1>
      <p>Organiza tus actividades académicas.</p>
    </div>
  </header>

  <main>
    <section class="tarjeta">
      <h2>Nueva tarea</h2>
      <form id="formulario">
        <label for="nombre">Nombre de la tarea</label>
        <div class="controles">
          <input
            type="text"
            id="nombre"
            placeholder="Ejemplo: estudiar JavaScript"
            maxlength="100"
            required>
          <button type="submit">Agregar tarea</button>
        </div>
      </form>
      <p id="mensaje" role="status"></p>
    </section>

    <section class="tarjeta">
      <h2>Lista de tareas</h2>
      <p id="contador" aria-live="polite">Pendientes: 0</p>
      <p id="contador-completadas" aria-live="polite">Completadas: 0</p>
      <p id="vacio">Todavía no tienes tareas.</p>
      <ul id="lista"></ul>
      <button id="eliminar-completadas" type="button">Eliminar completadas</button>
    </section>
  </main>

  <script>
    const formulario = document.querySelector("#formulario");
    const nombre = document.querySelector("#nombre");
    const lista = document.querySelector("#lista");
    const contador = document.querySelector("#contador");
    const contadorCompletadas = document.querySelector("#contador-completadas");
    const mensaje = document.querySelector("#mensaje");
    const vacio = document.querySelector("#vacio");
    const botonEliminarCompletadas = document.querySelector("#eliminar-completadas");

    let siguienteId = 0;

    function actualizarContador() {
      const casillas = lista.querySelectorAll('input[type="checkbox"]');
      const completadas = lista.querySelectorAll(
        'input[type="checkbox"]:checked'
      ).length;
      const pendientes = casillas.length - completadas;

      contador.textContent = `Pendientes: ${pendientes}`;
      contadorCompletadas.textContent = `Completadas: ${completadas}`;
      vacio.hidden = lista.children.length > 0;
    }

    formulario.addEventListener("submit", function (evento) {
      evento.preventDefault();

      const texto = nombre.value.trim();

      if (texto === "") {
        mensaje.textContent = "Escribe el nombre de la tarea.";
        nombre.focus();
        return;
      }

      const tarea = document.createElement("li");
      tarea.className = "tarea";

      const casilla = document.createElement("input");
      casilla.type = "checkbox";
      casilla.id = `tarea-${++siguienteId}`;

      const etiqueta = document.createElement("label");
      etiqueta.htmlFor = casilla.id;
      etiqueta.textContent = texto;

      casilla.addEventListener("change", function () {
        tarea.classList.toggle("completada", casilla.checked);
        actualizarContador();
      });

      const eliminar = document.createElement("button");
      eliminar.type = "button";
      eliminar.className = "boton-eliminar";
      eliminar.textContent = "Eliminar";
      eliminar.setAttribute("aria-label", `Eliminar la tarea: ${texto}`);

      eliminar.addEventListener("click", function () {
        const siguiente = tarea.nextElementSibling;
        const anterior = tarea.previousElementSibling;

        tarea.remove();
        actualizarContador();

        /* Mantiene el foco dentro de la lista al usar el teclado. */
        const destino =
          (siguiente && siguiente.querySelector('input[type="checkbox"]')) ||
          (anterior && anterior.querySelector('input[type="checkbox"]')) ||
          nombre;
        destino.focus();

        mensaje.textContent = "Tarea eliminada.";
      });

      tarea.append(casilla, etiqueta, eliminar);
      lista.append(tarea);

      formulario.reset();
      actualizarContador();
      mensaje.textContent = "Tarea agregada correctamente.";
      nombre.focus();
    });

    botonEliminarCompletadas.addEventListener("click", function () {
      const completadas = lista.querySelectorAll(".completada");

      if (completadas.length === 0) {
        mensaje.textContent = "No hay tareas completadas.";
        return;
      }

      completadas.forEach(function (tarea) {
        tarea.remove();
      });

      actualizarContador();
      mensaje.textContent = "Tareas completadas eliminadas.";
      nombre.focus();
    });
  </script>
</body>
</html>
